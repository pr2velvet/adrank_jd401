[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pr2velvet-adrank_jd401"
version = "0.1.0"
description = "为每一项打分并与阈值比较，明确标出通过、边界与不通过三档"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "pr2velvet" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://pr2velvet.github.io"
Repository = "https://github.com/pr2velvet/adrank_jd401"
Issues = "https://github.com/pr2velvet/adrank_jd401/issues"

[project.scripts]
adrank_jd401 = "adrank_jd401:main"

[tool.setuptools]
py-modules = ["adrank_jd401"]
